
name: Build and Deploy Fixeaze Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Fixeaze Admin App
        run: |
          unzip -q fixeaze_admin_app.zip
          test -f fixeaze_app/pubspec.yaml
          test -f fixeaze_app/lib/main_admin.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Flutter Web Platform
        working-directory: fixeaze_app
        run: flutter create . --platforms web

      - name: Get Flutter Dependencies
        working-directory: fixeaze_app
        run: flutter pub get

      - name: Build Fixeaze Admin Dashboard
        working-directory: fixeaze_app
        run: |
          flutter build web --release \
            -t lib/main_admin.dart \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Admin Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: fixeaze_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Admin Dashboard
        id: deployment
        uses: actions/deploy-pages@v4

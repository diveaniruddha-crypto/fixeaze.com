name: Build and publish Fixeaze Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the app
        run: |
          COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then echo "ERROR: no .zip file in the repo root"; exit 1; fi
          for z in *.zip; do unzip -q -o "$z"; done
          if [ ! -d fixeaze_app ]; then echo "ERROR: zip has no fixeaze_app folder"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up web part
        working-directory: fixeaze_app
        run: flutter create . --platforms web

      - name: Apply Fixeaze logo and name
        working-directory: fixeaze_app
        run: |
          cp -rf web_overrides/. web/
          sed -i 's/"Fixeaze"/"Fixeaze Admin"/g; s/<title>Fixeaze<\/title>/<title>Fixeaze Admin<\/title>/' web/manifest.json web/index.html

      - name: Get packages
        working-directory: fixeaze_app
        run: flutter pub get

      - name: Build
        working-directory: fixeaze_app
        run: flutter build web --release -t lib/main_admin.dart --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fixeaze_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

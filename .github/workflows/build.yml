name: Build Fixeaze site (download zip)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the app
        run: |
          echo "Files in the repo:"
          ls -la
          COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then echo "ERROR: no .zip file found in the repo root. Upload the app zip to the repo root."; exit 1; fi
          for z in *.zip; do echo "Unzipping $z"; unzip -q -o "$z"; done
          if [ ! -d fixeaze_app ]; then echo "ERROR: the zip did not contain a folder called fixeaze_app"; ls -la; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up web part
        working-directory: fixeaze_app
        run: flutter create . --platforms web

      - name: Apply Fixeaze logo and name
        working-directory: fixeaze_app
        run: |
          cp -rf web_overrides/. web/
          sed -i 's/"Fixeaze"/"Fixeaze Admin"/g; s/<title>Fixeaze<\/title>/<title>Fixeaze Admin<\/title>/' web/manifest.json web/index.html

      - name: Get packages
        working-directory: fixeaze_app
        run: flutter pub get

      - name: Build
        working-directory: fixeaze_app
        run: flutter build web --release -t lib/main_admin.dart --base-href "/"

      - uses: actions/upload-artifact@v4
        with:
          name: fixeaze-admin-site
          path: fixeaze_app/build/web
          retention-days: 14
